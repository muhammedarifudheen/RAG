[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-shared"
version = "0.0.0"
description = "Pydantic models shared by the Atlas API and worker"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
atlas_shared = ["py.typed"]
