# Render Blueprint for the public website's server (the site itself is on GitHub
# Pages). It runs deploy/server's image on Render's free plan: 512 MB of memory,
# asleep after 15 idle minutes, and no data kept across restarts. The starter
# sources in SEED_SOURCES are therefore built into the image (deploy/server/bake.sh);
# changing the setting rebuilds it.
services:
  - type: web
    name: atlas-api
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/server/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    # The website's changes do not need a new server.
    buildFilter:
      paths:
        - apps/api/**
        - apps/worker/**
        - packages/shared/**
        - deploy/server/**
    envVars:
      # The password for adding and removing sources: Environment tab in Render.
      - key: ADMIN_TOKEN
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["https://muhammedarifudheen.github.io"]'
      - key: SEED_SOURCES
        value: https://en.wikipedia.org/wiki/HMAC https://docs.python.org/3/library/hmac.html https://github.com/pallets/itsdangerous https://docs.python.org/3/library/hashlib.html https://docs.python.org/3/library/secrets.html https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html https://www.rfc-editor.org/rfc/rfc2104 https://itsdangerous.palletsprojects.com/en/stable/concepts/ https://itsdangerous.palletsprojects.com/en/stable/signer/ https://itsdangerous.palletsprojects.com/en/stable/serializer/ https://itsdangerous.palletsprojects.com/en/stable/timed/ https://itsdangerous.palletsprojects.com/en/stable/changes/
