[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-worker"
version = "0.0.0"
description = "Atlas ingestion worker"
requires-python = ">=3.11"
# atlas-api (table definitions) and atlas-shared are installed by path, see README.
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic-settings>=2.3",
    "dulwich>=0.22",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    # all-MiniLM-L6-v2 run with ONNX Runtime; see worker/embed.py.
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "huggingface-hub>=0.23",
    "numpy>=1.26",
    # Readable-text extraction from HTML, and text from PDFs.
    "trafilatura>=1.12",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
atlas-worker = "worker.__main__:main"
atlas-ingest = "worker.ingest:main"

[tool.setuptools.packages.find]
include = ["worker*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
