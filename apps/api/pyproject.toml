[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-api"
version = "0.0.0"
description = "Atlas HTTP API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic-settings>=2.3",
    "sentence-transformers>=3.0",
    "anthropic>=1.0",
    # Also the HTTP client for the Gemini provider.
    "httpx2>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2>=2.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
